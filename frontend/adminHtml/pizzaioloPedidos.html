<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/pizzaioloPedidos.css">
    <title>Pedidos — Pizzaiolo</title>
</head>
<body>
    <header class="header-pizzaiolo">
        <h1>👨‍🍳 Painel do Pizzaiolo — MammaMia</h1>
        <div class="usuario-logado">
            <span id="nomePizzaiolo">Pizzaiolo</span>
            <button id="btnSairPizzaiolo" class="btn-sair">Sair</button>
        </div>
    </header>

    <nav class="nav-abas">
        <button class="aba-btn ativa" data-alvo="recebidos">📋 Pedidos Recebidos</button>
        <button class="aba-btn" data-alvo="preparo">🔥 Em Preparo</button>
        <button class="aba-btn" data-alvo="entrega">🚚 Saindo para Entrega</button>
    </nav>

    <main class="conteudo-abas">
        <section class="aba-conteudo ativa" id="aba-recebidos">
            <div class="lista-pedidos" id="pedidosRecebidos"></div>
        </section>

        <section class="aba-conteudo" id="aba-preparo">
            <div class="lista-pedidos" id="pedidosEmPreparo"></div>
        </section>

        <section class="aba-conteudo" id="aba-entrega">
            <div class="lista-pedidos" id="pedidosEmEntrega"></div>
        </section>
    </main>

    <script src="../js/pizzaioloPedidos.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Mamma Mia</title>
    <link rel="stylesheet" href="../css/login.css">  
</head>
<body>
    <div class="tela-login">
        <div class="fundo-imagem"></div>

        <div class="caixa-login">
            <img src="../img/logoApp.png" alt="Logo Pizzaria Mamma Mia" class="logo">
            
            <form class="formulario" id="formLogin">
                <label for="campoUsuario">Nome de Usuário:</label>
                <input type="text" id="campoUsuario" name="usuario" placeholder="Digite seu nome de usuário" required>
                
                <label for="campoEmail">E-mail:</label>
                <input type="email" id="campoEmail" name="email" placeholder="seu@email.com" required>
                
                <label for="campoSenha">Senha:</label>
                <input type="password" id="campoSenha" name="senha" placeholder="••••••••" required>
                
                <div class="botoes-form">
                    <button type="reset" class="btn-limpar">Apagar</button>
                    <button type="submit" class="btn-entrar">Entrar</button>
                </div>
                
                <a href="#" class="link-senha">Esqueceu a senha?</a>
            </form>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
